[project]
name = "photoaident"
version = "0.1.0"
description = "AI powered photo tagging and search"
authors = [
    { name = "Sebastian Stein", email = "seb.kde@hpfsc.de" }
]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache" }
dependencies = [
    "pyside6>=6.10.2",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.24.0; sys_platform == 'linux'",
    "onnxruntime>=1.24.0; sys_platform != 'linux'",
    "faiss-cpu>=1.9.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0,<3.0.0", # insightface ABI requirement
    "SQLAlchemy>=2.0.0",
    "opencv-python-headless>=4.9.0",
    "tqdm>=4.66.0",
    "alembic>=1.18.4",
    "exifread>=3.5.1",
]

[project.scripts]
photoaident = "photoaident.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photoaident"]
sources = ["src"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pyinstaller>=6.19.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.4.0",
    "ty>=0.0.18",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
ignore = []

[tool.pytest.ini_options]
addopts = "-ra --cov=photoaident --cov-report=term-missing:skip-covered --cov-report=xml --cov-report=html -q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gpu: marks tests as requiring a GPU (CUDA) (deselect with '-m \"not gpu\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning:testcontainers(\\.|$)",
    "ignore::DeprecationWarning:importlib(\\.|$)",
]

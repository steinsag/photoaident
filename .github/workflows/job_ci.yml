name: Reusable CI Job

on:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # required for SonarCloud blame / new code detection

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Sync dependencies (including dev)
        run: uv sync

      - name: Install system dependencies for Qt and Xvfb and packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xinput0 libxcb-xkb1 libxkbcommon-x11-0 libegl1 xvfb libfuse2

      - name: Check code formatting with Black
        run: uv run black --check .

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Type check with ty
        run: uv run ty check

      - name: Run tests with pytest
        run: |
          # Use xvfb-run for tests that require a display (pyside6 + pytest-qt)
          xvfb-run --auto-servernum uv run pytest

      - name: Bundle with PyInstaller
        run: uv run scripts/build_pyinstaller.sh

      - name: Install linuxdeploy
        run: |
          # Download linuxdeploy and the Qt plugin
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

      - name: Build AppImage
        run: scripts/build_appimage.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photoaident-linux-appimage
          path: PhotoAIdent-x86_64.AppImage